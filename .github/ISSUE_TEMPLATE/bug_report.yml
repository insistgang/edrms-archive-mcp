name: 缺陷报告
description: 可复现的问题与修复跟踪
title: '[缺陷] '
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与脱敏环境信息
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据及影响
      description: 不上传Token、密码、客户原文、实机地址或完整日志。
